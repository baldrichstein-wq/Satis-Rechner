<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfactory Rechner</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <h1>Satisfactory Rechner</h1>
    </header>
    
    <nav id="mainNav">
        <div class="nav-group" id="calcLinks" style="display: none;">
            <a href="#" id="btnCalcStandard">Rezept berechnen</a>
            <a href="#" id="btnCalcAlt">Alternative Rezepte</a>
        </div>

        <div class="nav-group" id="modLinks" style="display: none;">
            <a href="#" id="btnEditRecipe">Rezept bearbeiten</a>
        </div>

        <div class="nav-group" id="adminLinks" style="display: none;">
            <a href="#" id="btnAddRecipe">Rezept +</a>
            <a href="#" id="btnDeleteRecipe">Rezept -</a>
            <a href="#" id="btnManageRoles">Rollen verwalten</a>
            <a href="#" id="btnDeleteUser">User löschen</a>
        </div>
        
        <a href="#" id="loginNavBtn">Anmelden</a>
        <a href="#" id="logoutNavBtn" style="display: none;">Abmelden (<span id="usernameDisplay"></span>)</a>
    </nav>

    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            
            <div id="loginFormContainer">
                <div class="modal-header">
                    <h2>Login</h2>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUser">Benutzername</label>
                        <input type="text" id="loginUser" required placeholder="FIO-Pionier Name">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Passwort</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="submit-btn">Einloggen</button>
                    <div class="toggle-form">
                        Noch kein Account? <a href="#" id="toRegister">Registrieren</a>
                    </div>
                </form>
            </div>

            <div id="registerFormContainer" style="display: none;">
                <div class="modal-header">
                    <h2>Registrierung</h2>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUser">Wähle einen Benutzernamen</label>
                        <input type="text" id="regUser" required placeholder="Z.B. Pioneer101">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Wähle ein Passwort</label>
                        <input type="password" id="regPassword" required minlength="3" placeholder="Mind. 3 Zeichen">
                    </div>
                    <button type="submit" class="submit-btn">Account erstellen</button>
                    <div class="toggle-form">
                        Bereits registriert? <a href="#" id="toLogin">Zum Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="center margin-top" style="flex-direction: column; align-items: center; background: #22252a; padding: 15px; border-radius: 5px; max-width: 500px; margin-left: auto; margin-right: auto; border: 1px dashed #fa9532;">
        <p style="color: #fa9532; margin: 0 0 10px 0; font-family: sans-serif;">Rollen-Simulation (Weil Node.js nicht im Browser läuft):</p>
        <div>
            <button onclick="window.satisfactoryUI.updateNavigation(null)">Ausgeloggt</button>
            <button onclick="window.satisfactoryUI.updateNavigation({name: 'Pionier', role: 'user'})">User</button>
            <button onclick="window.satisfactoryUI.updateNavigation({name: 'ManniMod', role: 'moderator'})">Moderator</button>
            <button onclick="window.satisfactoryUI.updateNavigation({name: 'AnniAdmin', role: 'admin'})">Admin</button>
        </div>
    </div>

    <script src="satis.js"></script>
</body>
</html>
